[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cornerstones-client"
version = "0.1.13"
description = "Public-safe Cornerstones client CLI for managed market context access"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Xiaolei Lu" }]
keywords = ["cornerstones", "market-data", "agent", "cli", "finance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: Other/Proprietary License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.28.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pytest>=8.0.0",
  "twine>=5.1.0",
]

[project.urls]
Homepage = "https://www.usecornerstones.com/"
Documentation = "https://www.usecornerstones.com/docs/beta-overview"
Changelog = "https://www.usecornerstones.com/docs/cli-guide"

[project.scripts]
cornerstones-client = "cornerstones_client.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"
